				<script>
					function draw_group_prepend_input(input_id, prepend_id ,multi_lang_id, placeholder, onblur) {
						var group_prepend_input_html = ""
						var onblur_html = ""
						if ( 'undefined' != typeof(onblur) )
							onblur_html='onblur="'+onblur+'"'
					
						group_prepend_input_html = '\
							<div class="input-field no-padding-hr-l col-xs-12 col-sm-12" style="display: inline-table;">\
								<div id="'+prepend_id+'" class="input-group__prepend" style="display: table-cell;"></div>\
								<input class="form-control hidden-dom-removal" style="display: table-cell;" id="'+input_id+'" name="'+input_id+'" placeholder="'+placeholder+'" required="required" type="text" '+onblur_html+'>\
								<label class="row active ng-binding" for="'+input_id+'"><span class="multi_lang" id="'+multi_lang_id+'">'+multi_lang_id+'</span></label>\
								<span class="error" id="'+input_id+'_error_msg" style="display:none">* This Field is Required</span>\
							</div>\
						';
					
						$("#group_prepend_input_"+input_id).html(group_prepend_input_html)
					}
				</script>
				<style>
					.input-group__prepend, .input-group__append{
						background-color: #f5f7fa;
