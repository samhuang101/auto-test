<!--Ethernet Port Status-->
<div class="row">
	<div class="col-lg-7 col-md-7 col-sm-12 col-xs-12">
		<div class="port_status col-sm-12 col-xs-12 col-lg-12 col-md-12 mbl-no-padding-hr no-padding-hr">
			<div class="panel">
				<div class="gemtek-Device-Status">
					<span class="multi_lang" id="lang_portstatus_title">Ethernet Port Status</span>
				</div>
				<div class="panel-body no-padding">
					<div class="row status_box" id="eth_port_zone"></div>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	lang_tag='dashboard'
	var INFO_LIST = ['DeviceInfo','InternetStatus','DhcpClientT','BackupWanStatus','LanStatus','WanStatus']
	var EasyDia = {"EasyDiagnostic":{"Action":"start"}};
	var INFO_DATA = {}
	var OBJ_LIST = ['WlanDeviceSsid']
	var ORIGINAL_OBJ_DATA = {}
	var MODIFIED_OBJ_DATA = {} 

	$(document).ready(function(){
		$.when(
			$.lang_load("dashboard")			
		).done(function(){
			loading_control(1);
			get_info_data(INFO_LIST)
		})
	});

	function get_info_success_cb(obj) {
		INFO_DATA = API.obj.copy(obj);
		info_init(INFO_DATA)
	}
	function get_info_error_cb(obj) {
		loading_control(0);

		if(obj.api_return == 403) {
			logout('sto');
		}
	}
	function get_info_data(info_list){
			API.info.get(info_list, get_info_success_cb, get_info_error_cb,20000);
	}

	function eth_port_layout(data){
		var layout_content=""
		var eth_port_down_img_path="img/icons/icon-1/ico-ethernet-port-inactive.svg"
		var eth_port_up_img_path="img/icons/icon-1/ico-ethernet-port-active.svg"
		$.each(G_ETH_PORT_LIST, function(index, eth_ifname) {
			iface_link_status = "Down"
			//$("#lanstatus").attr('src',pass_path)
			if (typeof(eth_ifname) == 'undefined')
				return;
			if( eth_ifname.search("LAN") > -1){
				$.each(data.LanStatus.Lan, function(i, lan_data) {
					if (lan_data.Interface == eth_ifname){
						iface_link_status = lan_data.Status
					}
				});
			}else if (eth_ifname.search("Backup WAN") > -1){
				if (data.BackupWanStatus.Ipv4[0].ConnectStatus != "disconnected"){
					iface_link_status = "Up"
				}
			}
			else if (eth_ifname.search("WAN") > -1){
				if (data.WanStatus.WanPort.Duplex != "")
					iface_link_status = "Up"
			}
			layout_content=layout_content+'<div class="gemtek-status-icons">'
			layout_content=layout_content+'<div class="lanport">'
			if (iface_link_status == "Up")
				layout_content=layout_content+'<img alt="img" src="'+eth_port_up_img_path+'">'
			else
				layout_content=layout_content+'<img alt="img" src="'+eth_port_down_img_path+'">'
			layout_content=layout_content+'<p class="">'+eth_ifname+'</p>'
			layout_content=layout_content+'</div></div>'
		});
		$("#eth_port_zone").html(layout_content)
	}

	function check_backupwan_status(backupwan_info){
		if(backupwan_info.WanPort.Status == "NoLink" && backupwan_info.Ipv4[0].ConnectStatus == "connected")
			return true
		else
			return false
	}

	function info_init(obj){
		// internet bashboard
		bacupwan_working=check_backupwan_status(obj.BackupWanStatus)
		if("OK" == obj.InternetStatus.WanStatus || bacupwan_working ){
			$("#internet_downup_status").text(L.dashboard.lang_intermet_up)
			$("#internet_downup_status_icon").removeClass("gemtek-status-down");
			$("#internet_downup_status_icon").addClass("gemtek-status-up");
			if(bacupwan_working){
				$("#internet_downup_status_ext").text("(Backup WAN)")
			}
		}else{
			$("#internet_downup_status").text(L.dashboard.lang_intermet_down)
			$("#internet_downup_status_icon").removeClass("gemtek-status-up");
			$("#internet_downup_status_icon").addClass("gemtek-status-down");
			$("#internet_downup_status_ext").text("")
		}
		$("#online_device_count").text(obj.DhcpClientT.Clients.length)
		$("#dashboard_internet_address").text(obj.InternetStatus.IpAddress)
		if(bacupwan_working){
			$("#dashboard_internet_protocol").text("DHCP")
			$("#dashboard_internet_dns1").text(obj.BackupWanStatus.Ipv4[0].Dns1)
			$("#dashboard_internet_dns2").text(obj.BackupWanStatus.Ipv4[0].Dns2)
		}else{
			$("#dashboard_internet_protocol").text(obj.InternetStatus.Protocol)	
			$("#dashboard_internet_dns1").text(obj.WanStatus.Ipv4[0].Dns1)
			$("#dashboard_internet_dns2").text(obj.WanStatus.Ipv4[0].Dns2)		
		}
		$("#dashboard_internet_macaddress").text(obj.DeviceInfo.Mac)

		//system dashboard
		//$("#dashboard_system_mfg").text('Gemtek Technology Co.')
		$("#dashboard_system_sn").text(obj.DeviceInfo.SN)
		$("#dashboard_system_swversion").text(obj.DeviceInfo.FwVer)
		$("#dashboard_system_modelname").text(obj.DeviceInfo.ModelName)
		$("#dashboard_system_hwversion").text(obj.DeviceInfo.HwVer)

		//
		eth_port_layout(obj)
		
		loading_control(0);
	}
</script>
