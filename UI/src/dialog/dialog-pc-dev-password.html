<div class="row">
	<div>
		<span class="multi_lang" id="lang_pc_password_info_title">Parental controls allow you to limit when your children can get online and the websites they can see. To user parental controls, first create a password.</span>
	</div>
</div>

<div class="row">
        <div id="pwinput_pc_pwd" class="no-padding-hr pwdblock col-xs-6 col-sm-6">
                <script>
                        draw_password('pc_pwd', 'lang_pc_password_title', 'Please Enter the value', '', '32')
                </script>
        </div>
</div>

<div class="row">
        <div id="pwinput_pc_verify_pwd" class="no-padding-hr pwdblock col-xs-6 col-sm-6">
                <script>
                        draw_password('pc_verify_pwd', 'lang_pc_verify_password_title', 'Please Enter the value', '', '32')
                </script>
        </div>
</div>

<div class="row">
	<div>
		<div class="error" style="display: none;" id="pc_pwd_error"></div>
	</div>
</div>
<br>
<div class="row">
        <div>
                <span class="multi_lang" id="lang_pc_qa_info_title">Enter a secret question and answer. These will be used if you forget your password and need to reset it.</span>
        </div>
</div>
<div class="row">
        <div id="input_pc_quest" class="form-group no-padding-hr col-xs-12 col-sm-12">
                <script>
                        draw_input('pc_quest', 'lang_pc_question_title', 'Please Enter the value', '', '32')
                </script>
        </div>
</div>
<div class="row">
        <div id="input_pc_ans" class="form-group no-padding-hr col-xs-12 col-sm-12">
                <script>
                        draw_input('pc_ans', 'lang_pc_answer_title', 'Please Enter the value', '', '32')
                </script>
        </div>
</div>
<div class="row">
        <div >
                <div class="error" style="display: none;" id="pc_qa_error"></div>
        </div>
</div>
