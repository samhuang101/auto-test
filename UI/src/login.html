<!DOCTYPE html>
<!-- saved from url=(0014)about:internet -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<title>Log in</title>
	<script language="javascript" type="text/javascript" src="js/env.js"></script>
	<!-- build:js -->
	<script language="javascript" type="text/javascript" src="js/jquery-3.7.1.min.js"></script>
	<script language="javascript" type="text/javascript" src="js/wapi-min.js"></script>
	<script language="javascript" type="text/javascript" src="js/common.js"></script>
	<script language="javascript" type="text/javascript" src="js/base64.js"></script>
	<script language="javascript" type="text/javascript" src="js/lang.js"></script>
	<!-- endbuild -->
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		* {
			outline: none;
			box-sizing: border-box;
		}

		html,
		body {
			font-family: 'Arial' !important;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
			font-size: 14px;
			/* background-image: url(login-data/wallpaper.jpg); */
			background-image: url(img/wallpaper.jpg);
			background-repeat: no-repeat;
			background-size: cover;
			margin: 0;
			height: 100vh;
		}

		#login_error_msg,
		#timer {
			height: 52px;
			background-color: #ff9c8d;
			color: #fff;
			text-align: center;
			font-size: 14px;
			margin: 30px 0 20px 0;
		}

		#login_error_msg {
			padding: 18px 0;
		}

		#timer {
			padding: 10px 0;
		}

		.btn {
			text-align: center;
			-ms-touch-action: manipulation;
			touch-action: manipulation;
			cursor: pointer;
			border: 1px solid transparent;
			border-radius: 4px;
			-webkit-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
			user-select: none;
			margin-top: 10px;
			width: 100%;
			height: 40px;
			color: #ffffff;
			background-color: #63cdf6;
			border: solid 1px rgba(0, 0, 0, 0.2);
		}

		.btn:hover,
		.btn:focus {
			text-decoration: none;
		}

		.btn:focus {
			border: solid 1.5px #004f83;
		}

		.btn:active {
			background-image: none;
			color: #ffffff;
			border: solid 1px #004f83;
			background-color: #004f83;
		}

		.btn:disabled {
			opacity: 0.5;
		}

		.panel {
			width: 360px;
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			padding: 10px;
			border-radius: 4px;
		}

		.panel-body {
			border-top: 1px solid #dee5ec;
			padding-top: 30px;
		}

		.panel-heading {
			text-align: center;
			padding-bottom: 30px;
		}

		.panel-form {
			margin-bottom: 20px;
		}

		label {
			display: block;
			font-size: 12px;
			color: #fff;
		}

		input {
			width: 100%;
			height: 40px;
			background-color: #fff;
			border: 1px solid #dee5ec;
			border-radius: 4px;
			padding: 13px 10px;
			font-size: 12px;
			color: #4b5057;
			transition: all .3s;
		}

		input:focus {
			border: solid 1.5px #004f83;
		}

		input:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}

		input::placeholder {
			opacity: 0.5;
		}
	</style>
</head>

<body>
	<div xmlns="http://www.w3.org/1999/xhtml" class="panel">
		<div class="panel-heading">
			<!-- <img src="https://192.168.11.1/login-data/logo.svg"> -->
			<img src="img/logo.svg">
		</div>
		<div class="panel-body">
			<div>
				<div class="wrapperdiv panel-form">
					<label>Username</label>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<input type="text" id="acnt_username" name="acnt_username" placeholder="Please enter username">
				</div>
				<div class="wrapperdiv panel-form">
					<label>Password</label>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<input type="password" id="acnt_passwd" name="acnt_passwd" placeholder="Please enter password">
				</div>
				<div id="timer" style="display: none;">
					<p style="margin: 0;">You have exceeded maximum invalid login attempts. Please try loging in after :
						<span id="time"></span></p>
				</div>
				<div id="login_error_msg" style="display: ;">
					<p style="margin: 0;"></p>
				</div>
				<div class="wrapperdiv">
					<button class="btn waves-effect waves-light" id="myButton" type="submit"><span class="multi_lang" id="lang_login_btn">Log In</span></button>
				</div>
			</div>
		</div>
	</div>
	<script>
		var INFO_LIST = []
		var INFO_DATA = {}
		var OBJ_LIST = ["Opmode","Mesh","QuickSetup"]
		var OBJ_DATA = {}
		const login_loginBtn = document.getElementById('myButton');
		const login_username = document.getElementById('acnt_username');
		const login_password = document.getElementById('acnt_passwd');

		$(document).ready(function(){
			$.when(
				$.lang_load("login")
			).done(function(){
				
				document.getElementById("timer").style.display = 'none';
				document.getElementById("login_error_msg").style.display = 'none';
				
				login_username.addEventListener('keyup', function (e) {
					if( e.keyCode === 13) {
						login_password.focus();
					}
				})
				
				login_password.addEventListener('keyup', function (e) {
					if( e.keyCode === 13) {
						login_validation();
					}
				})

				login_loginBtn.addEventListener('click', function () {
					login_validation();
				})
				
			})
		});
		
		function login_validation() {
			$("#login_error_msg").html('');
			$("#login_error_msg").hide();
			var isUser = true;
			var isPass = true;
			var isAccess = true;
			var pwd = $("#acnt_passwd").val();
			var username = $("#acnt_username").val();

			if (username == "" || pwd == "") {
				$("#login_error_msg").html("Invalid Login Credentials !");
				$("#login_error_msg").show();
				isUser = false;
				isPass = false;
			}
			else {
				$("#login_error_msg").hide();
				isUser = true;
				isPass = true;
			}

			/*
			if ( check_is_su(username) && ( (IS_LOCAL_USER && SASECURITY ) || (!IS_LOCAL_USER && !SAENABLED) ) ) {
				$("#login_error_msg").html(L.login.lang_login_permission_msg);
				$("#login_error_msg").show();
				isUser = false;
				isPass = false;
			}
			*/

			if(isUser && isPass){
				Submit(username, pwd);
			}
		}

		function redirect_page(){
			window.location.href = "main.html";
		}

		function layout_data_prepare(){
			API.obj.get(OBJ_LIST, get_obj_success_cb, get_obj_error_cb); 
		}

		function get_obj_success_cb(obj) {
			ORIGINAL_OBJ_DATA = API.obj.copy(obj); 
			MODIFIED_OBJ_DATA = API.obj.copy(ORIGINAL_OBJ_DATA);
			if(obj.api_return != 0){
				redirect_page()
				return;
			}
			if( obj.Opmode.OpModeP.Mode=='mrt_tag' || obj.Opmode.OpModeP.Mode=='mrt_untag' || obj.Opmode.OpModeP.Mode=='auto' )
				localStorage.opmode="rt"
			else
				localStorage.opmode="ap"

			if( (obj.Opmode.OpModeP.Mode=='mrt_tag' || obj.Opmode.OpModeP.Mode=='mrt_untag')  && obj.Mesh.MeshP.Enable=='1')
				localStorage.mesh_mode="1"
			else if( obj.Opmode.OpModeP.Mode=='ap' && obj.Mesh.MeshP.Enable=='1')
				localStorage.mesh_mode="2"
			else
				localStorage.mesh_mode="0"

			if('undefined'!= typeof(obj.QuickSetup.QuickSetupP.QuickSetupFlag))
				localStorage.qs=obj.QuickSetup.QuickSetupP.QuickSetupFlag
			else
				localStorage.qs=0
				
			if (localStorage.qs == 0 && qs_enabled == "1") {
				window.location.href = "/wizard.html"
			}
			else
				redirect_page()
		}
		function get_obj_error_cb(obj) {
			if(obj.api_return == 403){
				logout('sto')
				return;
			}else{
				redirect_page()
			}
				
		}

		function Submit(username, pwd) {
			document.getElementById("login_error_msg").style.display = 'none';
			
			var url = "cgi-bin/login.cgi"
			var username_base64 = encode64(username);
			var password_base64 = encode64(pwd);
			var senddata = {"username":username_base64,"password":password_base64,"token":"","source":"web","cn":"","action":"auth"};
			var post_data = JSON.obj_to_string(senddata);
			
			login_cb = {}
			login_cb.success = function(data, status) {
				var obj = jQuery.parseJSON(data);
				if ( obj.result == "success" ) {
					if ( "1" == obj.msg.AccessLevel)
						localStorage.setItem("p", 'sa');
					else if ( "2" == obj.msg.AccessLevel )
						localStorage.setItem("p", 'a');

					setTimeout(function(){
						localStorage.setItem("gUA", username);
						layout_data_prepare()
					}, 500);
				} else {
					$("#login_error_msg").html(L.login.lang_login_error_auth_msg);
					$("#login_error_msg").show();
					//captcha.refresh();
				}
			}
			login_cb.error = function(data, status) {
				setTimeout(function(){
					window.location.href = "main.html";
				}, 500);
			}
			REST_API_POST(url, post_data, login_cb)
		}
	</script>



</body></html>
