quicksetup.lang_wiz_license_agreement_content56=THE ARBITRATION SHALL OCCUR BEFORE A SINGLE ARBITRATOR, WHO MUST BE A RETIRED JUDGE OR JUSTICE, IN ONE OF SIX REGIONAL VENUES CONSISTENT WITH THE VENUE PROVISION BELOW. WHETHER OR NOT YOU PREVAIL IN THE DISPUTE SO LONG AS YOUR CLAIM IS NOT FOUND TO BE FRIVOLOUS BY THE ARBITRATOR AS MEASURED BY RULE 11(b) OF THE FEDERAL RULES OF CIVIL PROCEDURE, YOU SHALL BE ENTITLED TO BE REIMBURSED FOR YOUR COSTS OF ARBITRATION, WITHIN THE SOLE DISCRETION OF THE ARBITRATOR. IF THE ARBITRATION AWARD IS EQUAL TO OR GREATER THAN THE AMOUNT YOU DEMANDED IN YOUR ARBITRATION CLAIM, LINKSYS WILL PAY FOR YOUR REASONABLE AND ACTUAL ATTORNEYS' FEES YOU HAVE INCURRED TO ARBITRATE THE DISPUTE, PLUS A MINIMUM RECOVERY OF $2,500. ANY DECISION OR AWARD BY THE ARBITRATOR RENDERED IN AN ARBITRATION PROCEEDING SHALL BE FINAL AND BINDING ON EACH PARTY, AND MAY BE ENTERED AS A JUDGMENT IN ANY COURT OF COMPETENT JURISDICTION. IF EITHER PARTY BRINGS A DISPUTE IN A COURT OR OTHER NON-ARBITRATION FORUM, THE ARBITRATOR OR JUDGE MAY AWARD THE OTHER PARTY ITS REASONABLE COSTS AND EXPENSES (INCLUDING BUT NOT LIMITED TO ATTORNEYS' FEES) INCURRED IN ENFORCING COMPLIANCE WITH THIS BINDING ARBITRATION PROVISION, INCLUDING STAYING OR DISMISSING SUCH DISPUTE.
quicksetup.lang_wiz_license_agreement_content57=NEITHER YOU NOR LINKSYS SHALL BE ENTITLED TO JOIN OR CONSOLIDATE CLAIMS IN ARBITRATION BY OR AGAINST OTHER CONSUMERS OR ARBITRATE ANY CLAIMS AS A REPRESENTATIVE OR MEMBER OF A CLASS OR IN A PRIVATE ATTORNEY GENERAL CAPACITY. YOU UNDERSTAND THAT WITHOUT THIS PROVISION YOU MAY HAVE HAD A RIGHT TO ARBITRATE A DISPUTE ON A CLASSWIDE OR REPRESENTATIVE BASIS, AND THAT YOU HAVE EXPRESSLY AND KNOWINGLY WAIVED THOSE RIGHTS AND AGREE INSTEAD TO ARBITRATE ONLY YOUR OWN DISPUTE(S) IN ACCORDANCE WITH THE PROVISIONS OF THIS SECTION.
quicksetup.lang_wiz_license_agreement_content58=NOTWITHSTANDING THE ABOVE AGREEMENT TO ARBITRATE DISPUTES, YOU AND LINKSYS EACH ACKNOWLEDGE AND AGREE THAT EITHER PARTY MAY, AS AN ALTERNATIVE TO ARBITRATION, BRING AN INDIVIDUAL ACTION IN SMALL CLAIMS COURT TO RESOLVE A DISPUTE, SO LONG AS SUCH SMALL CLAIMS COURT DOES NOT PROVIDE FOR OR ALLOW FOR JOINDER OR CONSOLIDATION OF CLAIMS.
quicksetup.lang_wiz_license_agreement_content59=THIS AGREEMENT IS TO BE CONSTRUED IN ACCORDANCE WITH AND GOVERNED BY THE INTERNAL LAWS OF THE STATE OF CALIFORNIA WITHOUT GIVING EFFECT TO ANY CHOICE OF LAW RULE THAT WOULD CAUSE THE APPLICATION OF THE LAWS OF ANY JURISDICTION (OTHER THAN THE INTERNAL LAWS OF THE STATE OF CALIFORNIA) TO THE RIGHTS AND DUTIES OF THE PARTIES. HOWEVER, WITH RESPECT TO SOFTWARE PROVIDED, IF YOU ARE A CONSUMER AND YOU LIVE IN A COUNTRY WHERE LINKSYS MARKETS OR PROMOTES THE SOFTWARE, LOCAL LAW MAY REQUIRE THAT CERTAIN CONSUMER PROTECTION LAWS OF YOUR COUNTRY OF RESIDENCE APPLY TO SOME SECTIONS OF THIS AGREEMENT. EACH OF THE UNITED NATIONS CONVENTION ON CONTRACTS FOR THE INTERNATIONAL SALE OF GOODS AND THE UNITED NATIONS CONVENTION ON THE LIMITATION PERIOD IN THE INTERNATIONAL SALE OF GOODS IS HEREBY EXPRESSLY EXCLUDED AND WILL NOT APPLY TO THIS AGREEMENT.
quicksetup.lang_wiz_license_agreement_content60=EXCEPT FOR INDIVIDUAL SMALL CLAIMS ACTIONS WHICH CAN BE BROUGHT IN ANY SMALL CLAIMS COURT WHERE JURISDICTION AND VENUE ARE PROPER, ANY ARBITRATION, LEGAL SUIT, ACTION OR PROCEEDING ARISING OUT OF OR RELATING TO THIS AGREEMENT OR ANY DISPUTE SHALL BE COMMENCED IN (1) NEW YORK, NEW YORK, (2) ATLANTA, GEORGIA, (3) CHICAGO, ILLINOIS, (4) DALLAS, TEXAS, (5) SEATTLE, WASHINGTON, OR (6) LOS ANGELES, CALIFORNIA, AND YOU AND LINKSYS EACH IRREVOCABLY SUBMITS TO THE EXCLUSIVE JURISDICTION AND VENUE OF ANY SUCH PROCEEDING. HOWEVER, FOR A DISPUTE OF $10,000 OR LESS, YOU MAY CHOOSE WHETHER THE ARBITRATION IN ANY OF THE SIX REGIONAL VENUES PROCEEDS IN PERSON, BY TELEPHONE, OR BASED ONLY ON SUBMISSIONS.
