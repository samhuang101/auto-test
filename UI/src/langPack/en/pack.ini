quicksetup.lang_wiz_net_fail_step_explain=Open a web browser to see if you can access the Internet. If you can't open a web page, try the following:
quicksetup.lang_wiz_net_fail_step_1=Unplug the power cord from your DSL modem. If you have a cable modem, disconnect the power cord and the coaxial cable from the back of the modem. The modem is the device provided by your Internet Service Provider that connects to the Internet through a phone jack or cable outlet.
quicksetup.lang_wiz_net_fail_step_2=Wait 2 minutes
quicksetup.lang_wiz_net_fail_step_3=Re-connect the power cord (and TV cable) back into your modem and wait 2 more minutes.
quicksetup.lang_wiz_net_fail_step_4=Open a web page. If you still can't connect, click the <b>Exit</b> button to exit the Setup Wizard, then review or change the settings provided by your Internet Service Provider.
