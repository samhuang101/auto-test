<body id="blocked" >
	<div id="loading_topology" class="el-loading-mask" style="display: none;position: absolute;">
		<div class="el-loading-spinner">
				<svg viewBox="25 25 50 50" class="circular">
					<circle cx="50" cy="50" r="20" fill="none" class="path"></circle>
				</svg>
			</div>
		<div>
			<span class="el-loading-spinner-message" id="loading_message"></span>
		</div>
	</div>
	<div class="container-fluid">
		<div class="row">
			<div class="wrapper">
				<div class="warp-login">
					<h3 class="text-center"><span class="multi_lang" id="lang_content_title">Internet blocked</span></h3>
					<div class="fhv-centent">
						<p><span class="multi_lang" id="lang_content_info">Access to the Internet is blocked at this time.  Enter the parental controls password to make all blocked websites and content available for one hour.</span></p>
					</div>
					<div></div>
					<div class="form-group">
						<p class="title"><span class="multi_lang" id="lang_password_title">PASSWORD</span></p>
						<div><input type="password" id="pc_passwd" name="pc_passwd" class="input-form-login password" placeholder="PASSWORD"></div>
					</div>
					<div class="clear"></div>
					<div class="error loginError" style="display:none">
						<p><span style="color:red;" class="multi_lang" id="lang_password_incorrect"></span></p>
					</div>
					</div>

					<div class="text-center" style="margin-top:70px;"><button class="btn-signin" id="myButton" onclick="unlock()"><span class="multi_lang" id="lang_unblock_title">Unblock</span></button>
						<div></div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
<script language="JavaScript">
	var MAC = "00:00:00:00:00:00"
	var URL = ""
	$(document).ready(function(){
		var query_string=queryString();
		if( "undefined" != typeof(query_string.mac) && query_string.mac != "" )
			MAC = query_string.mac
		if( "undefined" != typeof(query_string.url) && query_string.url != "" )
			URL = decodeURIComponent(query_string.url)
			$.when(
				$.lang_load("parental_control_blocked")
			).done(function(){
			init_lang_list()
		})
	});

	function unlock()
	{
		pw = $("#pc_passwd").val()
		$(".loginError").hide()
		$("#loader").show()
		$.ajax({
			type: "GET",
			contentType: "application/json",
			dataType: 'json',
			url: '/pc/unlock?mac='+MAC+'&pwd='+pw,
			cache: false,
			timeout: 10000,
			beforeSend: onSend,
			success: onSuccess,
			complete: onComplete,
			error: onError
		});
		function onSend(){};
		function onError(){};
		function onComplete(){
	};
	function onSuccess(data){
		$("#loading_topology").css("display", "block");
		if("Success" == data.status.message){
			setTimeout(function(){
				$("#loading_topology").css("display", "none");
				window.close();
				window.location.href = URL + '?n=' + new Date().getTime(); // random number
			}, 3000);
		}
		else{
			$("#loader").hide()
			$(".loginError").show()
		}
	};
}
</script>
</html>
